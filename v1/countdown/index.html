<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Countdown Widget</title><link rel="stylesheet" href="../assets/widget.css"></head>
<body><main class="widget"><div class="stack"><div class="eyebrow">Countdown</div><h1 class="title" data-param="title">Something good is coming</h1><div class="units"><div class="unit"><strong id="days">0</strong><span>Days</span></div><div class="unit"><strong id="hours">0</strong><span>Hours</span></div><div class="unit"><strong id="minutes">0</strong><span>Minutes</span></div><div class="unit"><strong id="seconds">0</strong><span>Seconds</span></div></div></div></main><script src="../assets/widget.js"></script><script>
const fallback=new Date(Date.now()+30*864e5);const target=new Date(WidgetKit.get('date',fallback.toISOString()));const daysEl=document.getElementById('days'),hoursEl=document.getElementById('hours'),minutesEl=document.getElementById('minutes'),secondsEl=document.getElementById('seconds');function tick(){const delta=Math.max(0,target-Date.now());const d=Math.floor(delta/864e5),h=Math.floor(delta/36e5)%24,m=Math.floor(delta/6e4)%60,s=Math.floor(delta/1000)%60;daysEl.textContent=d;hoursEl.textContent=h;minutesEl.textContent=m;secondsEl.textContent=s;}tick();setInterval(tick,1000);
</script></body></html>
