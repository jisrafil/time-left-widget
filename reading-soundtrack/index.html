<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotify Playlist</title><link rel="stylesheet" href="../assets/widget.css"></head>
<body><main class="widget soundtrack-widget" id="widget"><div class="soundtrack-shell"><header class="soundtrack-heading"><div class="soundtrack-mark" aria-hidden="true">♫</div><div><h1 class="soundtrack-title" data-param="title">Spotify playlist</h1><p class="soundtrack-label" id="label">Press play and get lost in a book</p></div></header><iframe class="soundtrack-player" id="player" title="Spotify playlist" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe><p class="empty-state" id="error" hidden>Paste a public Spotify playlist URL or playlist ID in Joni Widget Studio.</p></div></main>
<script src="../assets/widget.js"></script><script>
const fallback='4ORIxTGwbBrKtsNkPvbFE5',incoming=WidgetKit.get('playlist',fallback),match=incoming.match(/playlist\/([A-Za-z0-9]+)/),id=(match?match[1]:(/^[A-Za-z0-9]{10,}$/.test(incoming)?incoming:'')),size=WidgetKit.get('size','compact');
document.getElementById('label').textContent=WidgetKit.get('label','Press play and get lost in a book').slice(0,100);
if(size==='full')document.getElementById('widget').classList.add('full');
if(id){document.getElementById('player').src=`https://open.spotify.com/embed/playlist/${id}?utm_source=generator&theme=0`;}else{document.getElementById('player').hidden=true;document.getElementById('error').hidden=false;}
</script></body></html>
