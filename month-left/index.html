<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Month Left Widget</title><link rel="stylesheet" href="../assets/widget.css"></head>
<body><main class="widget"><div class="stack"><div class="eyebrow">Month check</div><h1 class="title" data-param="title">Time left this month</h1><div class="units"><div class="unit"><strong id="days">0</strong><span>Days</span></div><div class="unit"><strong id="hours">0</strong><span>Hours</span></div><div class="unit"><strong id="minutes">0</strong><span>Minutes</span></div></div><p class="subtext" id="month"></p></div></main><script src="../assets/widget.js"></script><script>
const daysEl=document.getElementById('days'),hoursEl=document.getElementById('hours'),minutesEl=document.getElementById('minutes'),monthEl=document.getElementById('month');function tick(){const now=new Date(),end=new Date(now.getFullYear(),now.getMonth()+1,1),delta=end-now;daysEl.textContent=Math.floor(delta/864e5);hoursEl.textContent=Math.floor(delta/36e5)%24;minutesEl.textContent=Math.floor(delta/6e4)%60;monthEl.textContent=now.toLocaleDateString([],{month:'long',year:'numeric'});}tick();setInterval(tick,1000);
</script></body></html>
